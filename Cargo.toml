[package]
name = "titanic-flash"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "canada_engine"

[[bin]]
name = "titanic-flash"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libloading = "0.8"
libc = "0.2"
half = { version = "2", features = ["serde"] }
# Retain byte-exact weight checks while enabling the runtime-detected ARM SHA2 path.
sha2 = { version = "0.10", features = ["asm"] }
rayon = "1.12.0"
deepseek-recipe = { version = "=0.2.0", optional = true }
deepseek-recipe-core = { version = "=0.2.0", optional = true }
deepseek-recipe-encoding = { version = "=0.2.0", optional = true }
tokenizers = { version = "=0.23.2", optional = true }
tokio = { version = "=1.54.1", features = ["rt"], optional = true }
tokio-stream = { version = "=0.1.19", optional = true }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"], optional = true }
async-stream = { version = "=0.3.6", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"], optional = true }
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake", "require-simd"], optional = true }
data-url = { version = "=0.3.2", optional = true }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "=0.7.15"

[dev-dependencies]
base64 = "=0.22.1"

[profile.release]
lto = "thin"
codegen-units = 1

[features]
vision-input = ["dep:image", "dep:turbojpeg"]
protocol = ["dep:deepseek-recipe", "dep:deepseek-recipe-core", "dep:deepseek-recipe-encoding", "dep:tokenizers", "dep:tokio", "dep:tokio-stream"]
vision-protocol = ["protocol", "vision-input", "dep:data-url", "dep:ureq"]
serving = ["vision-protocol", "dep:axum", "dep:async-stream", "tokio/net", "tokio/sync", "tokio/time", "tokio/rt-multi-thread"]
# Isolated recovery qualification only; never enabled in a serving release.
storage-fault-injection = []

[[example]]
name = "vision-input"
required-features = ["vision-input"]

[[example]]
name = "host-input-pressure"
required-features = ["protocol"]

[[example]]
name = "forward-roundtrip"
required-features = ["protocol"]

[[example]]
name = "image-source-screen"
required-features = ["vision-protocol"]

